name: mobile_app
description: "SGS AI mobile app (Android + iOS)."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.7.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^14.6.2
  json_annotation: ^4.12.0
  url_launcher: ^6.3.3

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  swagger_dart_code_generator: ^4.1.1
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Variable.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DM-Sans-Variable.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DM-Sans-Variable.ttf
          weight: 700
