name: Release iOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed IPA
    # macOS minutes cost ~10x Linux — this never runs on pull requests.
    runs-on: macos-15
    timeout-minutes: 45
    environment: ${{ inputs.flavor || 'prod' }}
    env:
      FLAVOR: ${{ inputs.flavor || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Install signing assets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # TODO(APP-09): replace with `fastlane match readonly` against the
          # private certificates repo. Certificates must never be committed.
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode \
            > ~/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8

      - run: flutter pub get
      - name: Build IPA
        run: >-
          flutter build ipa --release --flavor "$FLAVOR"
          --dart-define-from-file="config/$FLAVOR.json"
          --export-options-plist=ios/ExportOptions.plist

      - name: Remove signing material
        if: always()
        run: rm -rf ~/private_keys

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ env.FLAVOR }}-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30
