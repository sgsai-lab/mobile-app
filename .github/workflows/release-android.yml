name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protected environment: reviewers approve before signing secrets are exposed.
    environment: ${{ inputs.flavor || 'prod' }}
    env:
      FLAVOR: ${{ inputs.flavor || 'prod' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.x"
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          mkdir -p "android/app/src/$FLAVOR"
          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode \
            > "android/app/src/$FLAVOR/google-services.json"
          cat > android/key.properties <<EOF
          storeFile=${{ github.workspace }}/android/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter pub get
      - name: Build app bundle
        run: >-
          flutter build appbundle --release --flavor "$FLAVOR"
          --dart-define-from-file="config/$FLAVOR.json"
          --dart-define=FIREBASE_ENABLED=true

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/upload-keystore.jks android/key.properties \
            "android/app/src/$FLAVOR/google-services.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ env.FLAVOR }}-release
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 30

  # TODO(APP-10): add a Play Store upload job (internal track) once the service
  # account is provisioned. Promote the same .aab — never rebuild per track.
