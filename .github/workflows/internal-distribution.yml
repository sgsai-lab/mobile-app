name: Internal distribution

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-distribution-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.x"
  FIREBASE_CLI_VERSION: "15.33.0"

jobs:
  android:
    name: Build and distribute dev APK
    if: ${{ vars.INTERNAL_ANDROID_DISTRIBUTION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: internal-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dev Firebase config
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/dev
          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode \
            > android/app/src/dev/google-services.json
      - run: flutter pub get
      - name: Build dev APK
        run: >-
          flutter build apk --debug --flavor dev
          --dart-define-from-file=config/dev.json
          --dart-define=FIREBASE_ENABLED=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dev-${{ github.sha }}.apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@"$FIREBASE_CLI_VERSION"
      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-dev-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Internal dev build ${GITHUB_SHA::7}"
      - name: Remove Firebase config and credentials
        if: always()
        run: |
          rm -f android/app/src/dev/google-services.json \
            "$RUNNER_TEMP/firebase-service-account.json"
      - name: Report build
        if: always()
        run: |
          {
            echo '## Android internal build'
            echo "Commit: \\`${GITHUB_SHA::7}\\`"
            echo "Artifact: app-dev-${GITHUB_SHA}.apk"
            echo "Distribution: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: Build and distribute dev IPA
    if: ${{ vars.INTERNAL_IOS_DISTRIBUTION == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    environment: internal-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_DEV_PROFILE_BASE64 }}
          IOS_FIREBASE_CONFIG_BASE64: ${{ secrets.IOS_FIREBASE_CONFIG_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ios-build.keychain-db"
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/dev.mobileprovision"
          profile_plist="$RUNNER_TEMP/dev-profile.plist"
          firebase_config="$GITHUB_WORKSPACE/ios/Runner/Firebase/dev/GoogleService-Info.plist"
          mkdir -p "$(dirname "$firebase_config")"
          printf '%s' "$IOS_FIREBASE_CONFIG_BASE64" | base64 -D > "$firebase_config"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$IOS_KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>com.sgsaitechnology.app.dev</key><string>$profile_name</string>
            </dict>
          </dict></plist>
          EOF
          echo "IOS_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "IOS_CERTIFICATE_PATH=$certificate" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$profile" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PLIST_PATH=$profile_plist" >> "$GITHUB_ENV"
          echo "IOS_FIREBASE_CONFIG_PATH=$firebase_config" >> "$GITHUB_ENV"

      - run: flutter pub get
      - name: Build dev IPA
        run: >-
          flutter build ipa --release --flavor dev
          --dart-define-from-file=config/dev.json
          --dart-define=FIREBASE_ENABLED=true
          --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dev-${{ github.sha }}.ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@"$FIREBASE_CLI_VERSION"
      - name: Distribute to testers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          firebase appdistribution:distribute build/ios/ipa/*.ipa \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "Internal dev build ${GITHUB_SHA::7}"
          rm -f "$RUNNER_TEMP/firebase-service-account.json"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$IOS_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$IOS_CERTIFICATE_PATH" "$IOS_PROFILE_PATH" \
            "$IOS_PROFILE_PLIST_PATH" "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/firebase-service-account.json" \
            "$IOS_FIREBASE_CONFIG_PATH"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
      - name: Report build
        if: always()
        run: |
          {
            echo '## iOS internal build'
            echo "Commit: \\`${GITHUB_SHA::7}\\`"
            echo "Artifact: app-dev-${GITHUB_SHA}.ipa"
            echo "Distribution: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
